<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title">Abra sua Bíblia!</title>
    <link rel="shortcut icon" href="/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/assets/icons/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192x192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4a6da7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Abra sua Bíblia" data-i18n-content="app.title">
    <meta name="description" content="Leia a Bíblia usando a tradução de sua preferência" data-i18n-content="app.description">
    
    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.abrasuabiblia.com.br/">
    <meta property="og:title" content="Abra sua Bíblia!">
    <meta property="og:description" content="Leia a Bíblia usando a tradução de sua preferência">
    <meta property="og:image" content="https://www.abrasuabiblia.com.br/assets/icons/icon-512x512.png">
    <meta property="og:image:width" content="512">
    <meta property="og:image:height" content="512">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:url" content="https://www.abrasuabiblia.com.br/">
    <meta name="twitter:title" content="Abra sua Bíblia!">
    <meta name="twitter:description" content="Leia a Bíblia usando a tradução de sua preferência">
    <meta name="twitter:image" content="https://www.abrasuabiblia.com.br/assets/icons/icon-512x512.png">
    
    <!-- Theme initialization script (prevents flash of wrong theme) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('selectedTheme') || 'auto';
            let effectiveTheme = savedTheme;
            if (savedTheme === 'auto') {
                effectiveTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            if (effectiveTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <!-- The screens are drawn by src/App.svelte -->
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
