name: CI

on:
    push:
        branches: [master, develop]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
            # Local copy of the Bibles (downloaded from the Blob store by the tests)
            - uses: actions/cache@v4
              with:
                  path: .bibles-cache
                  key: bibles-${{ hashFiles('bibles-catalog.json') }}
                  restore-keys: bibles-
            - run: npm run check
            - run: npx playwright install --with-deps chromium
            - run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-report
                  path: test-results/
                  retention-days: 7
